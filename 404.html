      var root = location.pathname.indexOf('/ubami-webpage/') === 0 ? '/ubami-webpage/' : '/';

      // shared links to them go to the homepage.
      var page = location.pathname.split('/').pop();

        'medziagos.html', 'darbai.html', 'vaporwave.html'];
      if (versions.indexOf(page) !== -1) location.replace(root);
      var base = document.createElement('base');
      base.href = root;
      document.head.appendChild(base);
    })();
  </script>
